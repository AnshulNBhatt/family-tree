<title>Vanshavali Family Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Tiro+Devanagari+Hindi&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Layout: a full-bleed, pannable canvas of generations under a slim top bar; the person card docks right on desktop and rises as a sheet on phones. */
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#F5F7F4; --ink:#1C2624; --muted:#5D6A66; --line:#C8D0CB;
  --accent:#0D6A62; --accent-ink:#FFFFFF; --accent-soft:#D3E8E3; --knot:#A86A12; --danger:#B3352A;
  --edge:#76857F; --dot:#D2D9D4;
  --shadow:0 1px 2px rgba(18,38,33,.08),0 8px 24px rgba(18,38,33,.10);
  --f-display:'Young Serif','Tiro Devanagari Hindi',Georgia,'Times New Roman',serif;
  --f-body:'Source Sans 3','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121817; --surface:#1C2422; --surface-2:#18201E; --ink:#E4EBE8; --muted:#98A6A1; --line:#34413D;
  --accent:#55BBAE; --accent-ink:#0A1412; --accent-soft:#1E3934; --knot:#DDA24A; --danger:#E46C60;
  --edge:#7D8D88; --dot:#222C29; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1C2422; --surface-2:#18201E; --ink:#E4EBE8; --muted:#98A6A1; --line:#34413D;
  --accent:#55BBAE; --accent-ink:#0A1412; --accent-soft:#1E3934; --knot:#DDA24A; --danger:#E46C60;
  --edge:#7D8D88; --dot:#222C29; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;position:relative}
button{-webkit-tap-highlight-color:transparent}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto;margin-right:auto}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.35;margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;line-height:1.4;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status i{flex:none}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.live i{background:var(--accent)}
.status.warn i{background:var(--knot)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);flex:none}
.seg button{border:0;background:transparent;padding:0 12px;min-height:38px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted);min-width:44px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.icon-btn{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.icon-btn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.search{position:relative;flex:0 1 260px;min-width:150px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:280px;overflow:auto;z-index:20;padding:4px}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--accent-soft);outline:none}
.results small{color:var(--muted);margin-left:6px}
.results p{margin:0;padding:8px 10px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--edge)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:default}

/* canvas */
.stage{position:relative;overflow:hidden;min-height:0}
#tree{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#tree.grabbing{cursor:grabbing}
.bgdot{fill:var(--dot)}
.e-parent{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linejoin:round}
.e-spouse-outer{fill:none;stroke:var(--knot);stroke-width:5;stroke-linecap:round}
.e-spouse-inner{fill:none;stroke:var(--bg);stroke-width:1.6;stroke-linecap:round}
.e-sib{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-dasharray:5 5}
.knot{fill:var(--bg);stroke:var(--knot);stroke-width:2}
.hl.e-parent,.hl.e-sib{stroke:var(--accent);stroke-width:2.6}
.hl.e-spouse-outer{stroke:var(--accent)}
.node{cursor:pointer}
.node .n-card{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.node:hover .n-card{stroke:var(--edge)}
.node:focus{outline:none}
.node:focus-visible .n-card{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 3}
.node.rel .n-card{stroke:var(--accent);stroke-width:1.6}
.node.sel .n-card{stroke:var(--accent);stroke-width:3}
.n-av{fill:var(--accent-soft)}
.n-sil{fill:var(--accent);opacity:.55}
.n-name{font-family:var(--f-body);font-weight:700;font-size:14px;fill:var(--ink)}
.n-sub{font-family:var(--f-body);font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}

.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom .btn{width:40px;height:40px;padding:0;font-size:18px;box-shadow:var(--shadow)}
@media (min-width:721px){.panel-open .zoom{right:calc(416px + env(safe-area-inset-right,0px))}}
.legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);display:grid;gap:5px;z-index:3;box-shadow:var(--shadow)}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{flex:none}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;z-index:2;pointer-events:none}
.overlay .box{pointer-events:auto;max-width:420px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px;box-shadow:var(--shadow);display:grid;gap:12px;justify-items:center}
.overlay h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.overlay p{margin:0;color:var(--muted)}
.mini-tree{width:160px;height:84px}
#passForm{display:grid;gap:10px;width:100%;max-width:280px}
#passForm input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:center;font-size:16px}
#passForm input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pass-err{color:var(--danger);font-size:13.5px;min-height:1.2em}

/* panel */
.panel{position:absolute;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow:auto;overscroll-behavior:contain;z-index:6;
  padding-right:env(safe-area-inset-right,0px)}
.panel-inner{--pv:0px;--pi:20px;padding:0 var(--pi) 28px;display:grid;gap:18px}
.sheetbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;margin:0 calc(-1 * var(--pi));padding:4px 8px;min-height:52px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;border:0;background:none;color:var(--accent);font-weight:700;font-size:15px;cursor:pointer;border-radius:8px;flex:none}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back:focus-visible{outline:2px solid var(--accent)}
.sb-title{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:14px}

/* family view: one person in the middle, relatives around them */
.family{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fam-col{max-width:560px;margin:0 auto;display:grid}
.fam-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;margin-bottom:6px}
.fam-top .back{padding-left:0}
.fam-top .back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.fam-sec{display:grid;gap:8px}
.fam-h{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.4}
.fam-h svg{flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcard{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer;min-width:0;width:100%;color:var(--ink)}
.pcard:active{transform:scale(.985)}
.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pav{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);flex:none;overflow:hidden;display:grid;place-items:center}
.pav img{width:100%;height:100%;object-fit:cover}
.pav svg{width:72%;height:72%}
.ptext{display:grid;min-width:0;gap:1px}
.prel{font-size:12px;line-height:1.35;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{font-size:12.5px;line-height:1.35;color:var(--muted);font-variant-numeric:tabular-nums}
.pcard.add{border-style:dashed;border-color:var(--accent);background:transparent}
.pcard.add .pav{background:transparent;border:1.5px dashed var(--accent);color:var(--accent);font-size:24px;font-weight:700;line-height:1}
.pcard.add .pname{color:var(--accent);font-size:14.5px}
.vline{width:2px;height:24px;background:var(--edge);margin:0 auto}
.gap{height:22px}
.focus{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:16px;border:2px solid var(--accent);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.focus .fav{width:84px;height:84px}
.focus h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.focus .alt{margin:2px 0 0;font-size:15px;line-height:1.4;overflow-wrap:anywhere;opacity:.8}
.focus .meta{margin:4px 0 0;font-size:13.5px;line-height:1.4;color:var(--muted)}
.focus .cta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.focus .cta .btn{flex:1 1 140px;min-height:44px}
.mini-row{display:flex;flex-wrap:wrap;gap:6px}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:14px;max-width:100%;color:var(--ink)}
.mini .pav{width:30px;height:30px}
.mini span.tx{display:grid;text-align:left;min-width:0;line-height:1.3}
.mini small{color:var(--muted);font-size:11.5px;font-weight:700}
.mini b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage.view-family #tree,.stage.view-family .zoom,.stage.view-family .legend{display:none}

/* bottom tab bar: phones only */
.tabbar{display:none}
@media (max-width:720px){
  .bar{flex-wrap:nowrap;gap:8px;padding-block:8px}
  .brand h1{font-size:19px}
  .viewtog,#addPersonBtn{display:none}
  .icon-btn{display:inline-flex}
  .search{display:none;position:absolute;left:0;right:0;top:100%;padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
  .bar.searching .search{display:block}
  .search input{min-height:46px}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
  .tabbar button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;line-height:1.2}
  .tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .tabbar button[aria-pressed="true"]{color:var(--accent)}
  .tabbar .plus{width:30px;height:24px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;line-height:1}
  .tabbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
  .app.panel-open .tabbar{display:none}
  .panel{left:0;width:auto;border-left:0;box-shadow:none;padding-left:env(safe-area-inset-left,0px)}
  .panel-inner{--pi:16px}
  .legend{display:none}
  .panel-open .zoom{display:none}
  .zoom{bottom:12px}
  .zoom .btn{width:44px;height:44px}
  input,select,textarea{font-size:16px!important}
  .add-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .add-grid .btn{min-height:46px}
  .row-actions .btn{min-height:44px}
}
@media (max-width:520px){
  form .two,form .bi .pair{grid-template-columns:1fr}
  dl.facts{grid-template-columns:1fr}
  dl.facts dt{border-bottom:0;padding-bottom:0;font-size:12.5px}
  dl.facts dd{padding-top:2px}
  .rel-g{grid-template-columns:1fr;gap:4px}
  .rel-g .lbl{padding-top:0;font-size:12.5px}
  .chip{font-size:15px}
  .chip button.go{min-height:36px}
  .chip button.rm{width:32px;height:32px;font-size:17px}
  .head{gap:12px}
  .avatar{width:64px;height:64px}
}
.head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--accent-soft);overflow:hidden;display:grid;place-items:center;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:60%;height:60%}
.head h2{font-family:var(--f-display);font-weight:400;font-size:23px;line-height:1.2;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.head .alt{margin:2px 0 0;font-size:15px;color:var(--ink);opacity:.8;overflow-wrap:anywhere}
.head .meta{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.x{width:36px;height:36px;border-radius:8px;border:0;background:transparent;cursor:pointer;font-size:20px;color:var(--muted);align-self:start}
.x:hover{background:var(--surface-2)}
.x:focus-visible{outline:2px solid var(--accent)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.linkish{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px}
.linkish:focus-visible{outline:2px solid var(--accent)}
dl.facts{margin:0;display:grid;grid-template-columns:minmax(110px,auto) 1fr;border-top:1px solid var(--line)}
dl.facts dt,dl.facts dd{padding:9px 0;border-bottom:1px solid var(--line);margin:0}
dl.facts dt{color:var(--muted);font-size:13.5px;padding-right:12px}
dl.facts dd{min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
dl.facts dd.empty{color:var(--muted);font-style:italic;font-size:13.5px}
.copy{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:12px;padding:2px 8px;cursor:pointer}
.rels{display:grid;gap:10px}
.rel-g{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:8px;align-items:start}
.rel-g .lbl{color:var(--muted);font-size:13.5px;padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 4px;font-size:14px;max-width:100%}
.chip button.go{border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 0;font-weight:700;min-width:0}
.chip button.go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dot{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);overflow:hidden;flex:none;display:grid;place-items:center}
.chip .dot img{width:100%;height:100%;object-fit:cover}
.chip .dot svg{width:70%;height:70%}
.chip button.rm{border:0;background:var(--surface);border-radius:50%;width:22px;height:22px;cursor:pointer;color:var(--danger);font-size:14px;line-height:1}
.chip button:focus-visible{outline:2px solid var(--accent);border-radius:999px}
.add-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.add-grid .wide{grid-column:1/-1}
.note{font-size:13px;color:var(--muted);margin:0}

form.f{display:grid;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.field textarea{min-height:72px;resize:vertical}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bi{display:grid;gap:6px;border:0;margin:0;padding:0;min-width:0}
.bi legend{font-size:13px;color:var(--muted);font-weight:700;padding:0;margin-bottom:4px}
.bi .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bi .pair>*{min-width:0}
.bi .tag{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.bi input,.bi textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.bi textarea{min-height:64px;resize:vertical}
.bi input:focus-visible,.bi textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
@media (max-width:420px){.bi .pair{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}

/* ================= layout ================= */
function layout() {
  const ids = [...people.keys()].sort((a, b) => (people.get(a).createdAt || 0) - (people.get(b).createdAt || 0) || (a < b ? -1 : 1));
  const gen = new Map(), order = [];
  for (const s of ids) {
    if (gen.has(s)) continue;
    const comp = []; gen.set(s, 0); const q = [s];
    while (q.length) {
      const u = q.shift(); comp.push(u); const gu = gen.get(u);
      for (const p of S(idx.parents, u)) if (!gen.has(p)) { gen.set(p, gu - 1); q.push(p); }
      for (const v of S(idx.spouses, u)) if (!gen.has(v)) { gen.set(v, gu); q.push(v); }
      for (const v of S(idx.sibx, u)) if (!gen.has(v)) { gen.set(v, gu); q.push(v); }
      for (const c of S(idx.children, u)) if (!gen.has(c)) { gen.set(c, gu + 1); q.push(c); }
    }
    const m = Math.min(...comp.map((c) => gen.get(c)));
    comp.forEach((c) => gen.set(c, gen.get(c) - m));
    order.push(...comp);
  }
  const unitOf = new Map(), units = [];
  for (const u of order) {
    if (unitOf.has(u)) continue;
    const mem = [], st = [u]; unitOf.set(u, null);
    while (st.length) { const x = st.pop(); mem.push(x); for (const s of S(idx.spouses, x)) if (!unitOf.has(s) && gen.get(s) === gen.get(x)) { unitOf.set(s, null); st.push(s); } }
    const unit = { members: mem, gen: gen.get(u), x: 0, w: 0, pset: new Set() };
    mem.forEach((m) => { unitOf.set(m, unit); S(idx.parents, m).forEach((p) => unit.pset.add(p)); });
    if (mem.length > 2) {
      const sc = (m) => [...S(idx.spouses, m)].filter((s) => mem.includes(s)).length;
      const hub = mem.slice().sort((a, b) => sc(b) - sc(a))[0];
      const rest = mem.filter((m) => m !== hub);
      const half = Math.floor(rest.length / 2);
      unit.members = [...rest.slice(0, half), hub, ...rest.slice(half)];
    } else if (mem.length === 2) {
      const [a, b] = mem;
      if (people.get(a).gender !== "male" && people.get(b).gender === "male") unit.members = [b, a];
    }
    unit.w = unit.members.length * NODE_W + (unit.members.length - 1) * SPOUSE_GAP;
    units.push(unit);
  }
  const rows = new Map();
  units.forEach((u) => { if (!rows.has(u.gen)) rows.set(u.gen, []); rows.get(u.gen).push(u); });
  const gens = [...rows.keys()].sort((a, b) => a - b);
  const X = new Map();
  const off = (u, i) => -u.w / 2 + NODE_W / 2 + i * (NODE_W + SPOUSE_GAP);
  const updX = (row) => row.forEach((u) => u.members.forEach((m, i) => X.set(m, u.x + off(u, i))));
  const gapBetween = (a, b) => { for (const p of a.pset) if (b.pset.has(p)) return UNIT_GAP; return FAMILY_GAP; };
  const pAvg = (m, g) => { const ps = [...S(idx.parents, m)].filter((p) => gen.get(p) < g && X.has(p)); return ps.length ? mean(ps.map((p) => X.get(p))) : null; };
  const parentBary = (u) => {
    let s = 0, n = 0;
    u.members.forEach((m, i) => { const a = pAvg(m, u.gen); if (a != null) { s += a - off(u, i); n++; } });
    return n ? s / n : null;
  };
  const childBary = (u) => {
    const cs = new Set();
    u.members.forEach((m) => S(idx.children, m).forEach((c) => { if (gen.get(c) > u.gen && X.has(c)) cs.add(c); }));
    return cs.size ? mean([...cs].map((c) => X.get(c))) : null;
  };
  const orderMembers = (u) => {
    if (u.members.length !== 2) return;
    const [a, b] = u.members; const pa = pAvg(a, u.gen), pb = pAvg(b, u.gen);
    if (pa != null && pb != null && pa > pb) u.members = [b, a];
  };
  const pack = (row) => {
    let x = 0;
    row.forEach((u, i) => { if (i) x += (row[i - 1].w + u.w) / 2 + gapBetween(row[i - 1], u); u.x = x; });
    const mid = x / 2; row.forEach((u) => (u.x -= mid));
  };
  const sortBy = (row, keyFn) => {
    row.forEach((u, i) => { const k = keyFn(u); u._k = k == null ? u.x : k; u._i = i; });
    row.sort((a, b) => a._k - b._k || a._i - b._i);
  };
  const placeRow = (row, desired) => {
    const n = row.length; if (!n) return;
    const c = [0];
    for (let i = 1; i < n; i++) c[i] = c[i - 1] + (row[i - 1].w + row[i].w) / 2 + gapBetween(row[i - 1], row[i]);
    const blocks = [];
    for (let i = 0; i < n; i++) {
      blocks.push({ s: desired[i] - c[i], n: 1, i0: i });
      while (blocks.length > 1) {
        const b = blocks[blocks.length - 1], a = blocks[blocks.length - 2];
        if (a.s / a.n > b.s / b.n) { a.s += b.s; a.n += b.n; blocks.pop(); } else break;
      }
    }
    for (const b of blocks) { const m = b.s / b.n; for (let j = b.i0; j < b.i0 + b.n; j++) row[j].x = m + c[j]; }
  };
  gens.forEach((g) => { pack(rows.get(g)); updX(rows.get(g)); });
  for (let it = 0; it < 6; it++) {
    for (const g of gens) { const row = rows.get(g); row.forEach(orderMembers); sortBy(row, parentBary); pack(row); updX(row); }
    if (it === 5) break;
    for (const g of [...gens].reverse()) { const row = rows.get(g); sortBy(row, childBary); pack(row); updX(row); }
  }
  for (let it = 0; it < 12; it++) {
    for (const g of gens) { const row = rows.get(g); placeRow(row, row.map((u) => parentBary(u) ?? u.x)); updX(row); }
    for (const g of [...gens].reverse()) { const row = rows.get(g); placeRow(row, row.map((u) => childBary(u) ?? u.x)); updX(row); }
  }
  const Y = new Map(); for (const id of ids) Y.set(id, gen.get(id) * ROW_H);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const id of ids) { minX = Math.min(minX, X.get(id) - NODE_W / 2); maxX = Math.max(maxX, X.get(id) + NODE_W / 2); minY = Math.min(minY, Y.get(id)); maxY = Math.max(maxY, Y.get(id) + NODE_H); }
  return { X, Y, gen, bounds: { minX, maxX, minY, maxY } };
}

/* ================= tree render ================= */
const gEdges = $("#gEdges"), gNodes = $("#gNodes");
function relatedSet(id) {
  if (!id || !people.has(id)) return new Set();
  return new Set([...parentsOf(id), ...childrenOf(id), ...spousesOf(id), ...siblingsOf(id)]);
}
function renderTree() {
  gEdges.replaceChildren(); gNodes.replaceChildren();
  if (!people.size || mode === "locked") { lastLayout = null; return; }
  const L = layout(); lastLayout = L;
  const { X, Y } = L;
  const cy = (id) => Y.get(id) + NODE_H / 2, bot = (id) => Y.get(id) + NODE_H;
  const rel = relatedSet(sel);
  const knots = [];

  const spouseDone = new Set();
  for (const [a, set] of idx.spouses) for (const b of set) {
    const k = rid("spouse", a, b); if (spouseDone.has(k)) continue; spouseDone.add(k);
    const [l, r] = X.get(a) <= X.get(b) ? [a, b] : [b, a];
    let d;
    const sameRow = Y.get(l) === Y.get(r), adjacent = sameRow && Math.abs(X.get(r) - X.get(l) - (NODE_W + SPOUSE_GAP)) < 1;
    if (adjacent) { d = `M${X.get(l) + NODE_W / 2} ${cy(l)}H${X.get(r) - NODE_W / 2}`; knots.push([(X.get(l) + X.get(r)) / 2, cy(l)]); }
    else if (sameRow) { const x1 = X.get(l), x2 = X.get(r), y = Y.get(l); d = `M${x1} ${y}C${x1} ${y - 46} ${x2} ${y - 46} ${x2} ${y}`; }
    else d = `M${X.get(l)} ${cy(l)}L${X.get(r)} ${cy(r)}`;
    const hl = sel && (a === sel || b === sel) ? " hl" : "";
    el("path", { d, class: "e-spouse-outer" + hl }, gEdges);
    el("path", { d, class: "e-spouse-inner" }, gEdges);
  }

  const fam = new Map();
  for (const [c, ps] of idx.parents) {
    const arr = [...ps].sort(); const k = arr.join("|");
    if (!fam.has(k)) fam.set(k, { parents: arr, kids: [] });
    fam.get(k).kids.push(c);
  }
  const stagger = new Map();
  for (const f of fam.values()) {
    const ps = f.parents, kids = f.kids;
    const kidTop = Math.min(...kids.map((k) => Y.get(k)));
    const si = stagger.get(kidTop) || 0; stagger.set(kidTop, si + 1);
    const busY = kidTop - (ROW_H - NODE_H) / 2 + ((si % 3) - 1) * 9;
    let sx, sy, d = "";
    const married = ps.length === 2 && S(idx.spouses, ps[0]).has(ps[1]) && Y.get(ps[0]) === Y.get(ps[1]) && Math.abs(Math.abs(X.get(ps[0]) - X.get(ps[1])) - (NODE_W + SPOUSE_GAP)) < 1;
    if (ps.length === 1) { sx = X.get(ps[0]); sy = bot(ps[0]); }
    else if (married) { sx = (X.get(ps[0]) + X.get(ps[1])) / 2; sy = cy(ps[0]); }
    else {
      sx = mean(ps.map((p) => X.get(p))); sy = Math.max(...ps.map(bot)) + 16;
      for (const p of ps) d += `M${X.get(p)} ${bot(p)}V${sy}H${sx}`;
    }
    if (ps.every((p) => bot(p) < busY - 4)) {
      const xs = kids.map((k) => X.get(k));
      d += `M${sx} ${sy}V${busY}`;
      const lo = Math.min(sx, ...xs), hi = Math.max(sx, ...xs);
      if (hi - lo > 0.5) d += `M${lo} ${busY}H${hi}`;
      for (const k of kids) d += `M${X.get(k)} ${busY}V${Y.get(k)}`;
    } else {
      for (const k of kids) { const tx2 = X.get(k), ty = Y.get(k); d += `M${sx} ${sy}C${sx} ${sy + 60} ${tx2} ${ty - 60} ${tx2} ${ty}`; }
    }
    const hl = sel && (ps.includes(sel) || kids.includes(sel)) ? " hl" : "";
    el("path", { d, class: "e-parent" + hl }, gEdges);
  }

  for (const r of relations.values()) {
    if (r.type !== "sibling" || !people.has(r.a) || !people.has(r.b)) continue;
    if (parentsOf(r.a).some((p) => S(idx.parents, r.b).has(p))) continue;
    const [l, rr] = X.get(r.a) <= X.get(r.b) ? [r.a, r.b] : [r.b, r.a];
    const x1 = X.get(l), x2 = X.get(rr), y1 = Y.get(l), y2 = Y.get(rr);
    const h = Math.min(60, 26 + Math.abs(x2 - x1) * 0.08);
    const hl = sel && (r.a === sel || r.b === sel) ? " hl" : "";
    el("path", { d: `M${x1} ${y1}C${x1} ${y1 - h} ${x2} ${y2 - h} ${x2} ${y2}`, class: "e-sib" + hl }, gEdges);
  }
  for (const [x, y] of knots) el("circle", { cx: x, cy: y, r: 5, class: "knot" }, gEdges);

  for (const id of people.keys()) {
    const p = people.get(id);
    const name = nm(id);
    const cls = "node" + (id === sel ? " sel" : rel.has(id) ? " rel" : "");
    const g = el("g", { class: cls, transform: `translate(${X.get(id) - NODE_W / 2},${Y.get(id)})`, "data-id": id, tabindex: "0", role: "button", "aria-label": t("open_details", { n: name }) }, gNodes);
    el("title", {}, g).textContent = [tx(p, "name"), txAlt(p, "name")].filter(Boolean).join(" · ") || name;
    el("rect", { class: "n-card", width: NODE_W, height: NODE_H, rx: 12 }, g);
    el("circle", { class: "n-av", cx: 30, cy: 30, r: 21 }, g);
    const ph = photos.get(id)?.data;
    if (ph) el("image", { href: ph, x: 9, y: 9, width: 42, height: 42, "clip-path": "url(#avClip)", preserveAspectRatio: "xMidYMid slice" }, g);
    else el("use", { href: "#sil", x: 13, y: 13, width: 34, height: 34, class: "n-sil" }, g);
    const ll = lifeLine(p);
    const nt = el("text", { class: "n-name", x: 60, y: ll ? 27 : 35 }, g);
    nt.textContent = name;
    try { let s = name; while (nt.getComputedTextLength() > NODE_W - 70 && s.length > 2) { s = s.slice(0, -1); nt.textContent = s.trimEnd() + "…"; } } catch (e) {}
    if (ll) el("text", { class: "n-sub", x: 60, y: 45 }, g).textContent = ll;

/* ================= pan & zoom ================= */
const svg = $("#tree"), vp = $("#viewport");

}

/* Returns each relative with an English and a Hindi label. Hindi uses the specific kinship terms
   (dada/nana, chacha/tau/mama, devar/jeth, ...), which depend on which side and on relative age. */
function relativesOf(id) {
  const me = people.get(id), out = [], seen = new Set([id]);
  const g = (x) => people.get(x)?.gender;
  const push = (x, en, hi, direct) => { if (seen.has(x) || !people.has(x)) return; seen.add(x); out.push({ id: x, en, hi, direct: direct || null }); };
  const byG = (x, m, f, n) => G(g(x), m, f, n);
  const parents = parentsOf(id).sort(byAge), spouses = spousesOf(id), sibs = siblingsOf(id).sort(byAge), kids = childrenOf(id).sort(byAge);

  parents.forEach((p) => push(p, byG(p, "Father", "Mother", "Parent"), byG(p, "पिता", "माता", "अभिभावक"), rid("parent", p, id)));
  spouses.forEach((s) => push(s, byG(s, "Husband", "Wife", "Spouse"), byG(s, "पति", "पत्नी", "जीवनसाथी"), rid("spouse", s, id)));
  sibs.forEach((s) => {
    const o = older(s, id);
    const hi = byG(s, o === true ? "बड़े भाई" : o === false ? "छोटा भाई" : "भाई", o === true ? "बड़ी बहन" : o === false ? "छोटी बहन" : "बहन", "भाई-बहन");
    push(s, byG(s, "Brother", "Sister", "Sibling"), hi, relations.has(rid("sibling", s, id)) ? rid("sibling", s, id) : null);
  });
  kids.forEach((c) => push(c, byG(c, "Son", "Daughter", "Child"), byG(c, "बेटा", "बेटी", "संतान"), rid("parent", id, c)));

  // grandparents: paternal (dada/dadi) or maternal (nana/nani)
  parents.forEach((p) => parentsOf(p).sort(byAge).forEach((gp) => {
    const side = g(p);
    const en = byG(gp, "Grandfather", "Grandmother", "Grandparent") ;
    const enS = side === "male" ? "Paternal " + en.toLowerCase() : side === "female" ? "Maternal " + en.toLowerCase() : en;
    const hi = side === "male" ? byG(gp, "दादा", "दादी", "दादा-दादी") : side === "female" ? byG(gp, "नाना", "नानी", "नाना-नानी") : byG(gp, "दादा/नाना", "दादी/नानी", "दादा-नाना");
    push(gp, enS, hi);
  }));
  // grandchildren: through a son (pota/poti) or a daughter (nati/natin)
  kids.forEach((c) => childrenOf(c).sort(byAge).forEach((gc) => {
    const side = g(c);
    const hi = side === "male" ? byG(gc, "पोता", "पोती", "पोता-पोती") : side === "female" ? byG(gc, "नाती", "नातिन", "नाती-नातिन") : byG(gc, "पोता/नाती", "पोती/नातिन", "पोता/नाती");
    push(gc, byG(gc, "Grandson", "Granddaughter", "Grandchild"), hi);
  }));
  // parents-in-law
  spouses.forEach((s) => parentsOf(s).forEach((x) => push(x, byG(x, "Father-in-law", "Mother-in-law", "Parent-in-law"), byG(x, "ससुर", "सास", "सास-ससुर"))));
  // spouse's siblings: husband's brother = jeth (older) / devar (younger), husband's sister = nanad; wife's brother = sala, wife's sister = sali
  spouses.forEach((s) => siblingsOf(s).sort(byAge).forEach((x) => {
    const o = older(x, s); let hi;
    if (g(s) === "male") hi = byG(x, o === true ? "जेठ" : o === false ? "देवर" : "जेठ/देवर", "ननद", "ननद/देवर");
    else if (g(s) === "female") hi = byG(x, "साला", "साली", "साला/साली");
    else hi = byG(x, "जीजा/साला", "भाभी/साली", "रिश्तेदार");
    push(x, byG(x, "Brother-in-law", "Sister-in-law", "Sibling-in-law"), hi);
  }));
  // siblings' spouses: brother's wife = bhabhi, sister's husband = jija
  sibs.forEach((s) => spousesOf(s).forEach((x) => {
    const hi = g(s) === "male" ? byG(x, "भाई के पति", "भाभी", "भाभी") : g(s) === "female" ? byG(x, "जीजा", "बहन की पत्नी", "जीजा") : byG(x, "जीजा", "भाभी", "रिश्तेदार");
    push(x, byG(x, "Brother-in-law", "Sister-in-law", "Sibling-in-law"), hi);
  }));
  // children's spouses
  kids.forEach((c) => spousesOf(c).forEach((x) => push(x, byG(x, "Son-in-law", "Daughter-in-law", "Child-in-law"), byG(x, "दामाद", "बहू", "दामाद/बहू"))));
  // uncles and aunts, their spouses, and cousins
  const cousins = [];
  parents.forEach((p) => siblingsOf(p).sort(byAge).forEach((u) => {
    const side = g(p), o = older(u, p);
    let en, hi, spEn, spHi, cHi;
    if (side === "male") {
      if (g(u) === "male") { en = "Paternal uncle"; hi = o === true ? "ताऊ" : o === false ? "चाचा" : "चाचा/ताऊ"; spHi = o === true ? "ताई" : o === false ? "चाची" : "चाची/ताई"; spEn = "Paternal aunt"; cHi = ["चचेरा भाई", "चचेरी बहन"]; }
      else { en = "Paternal aunt"; hi = "बुआ"; spHi = "फूफा"; spEn = "Paternal uncle"; cHi = ["फुफेरा भाई", "फुफेरी बहन"]; }
    } else if (side === "female") {
      if (g(u) === "male") { en = "Maternal uncle"; hi = "मामा"; spHi = "मामी"; spEn = "Maternal aunt"; cHi = ["ममेरा भाई", "ममेरी बहन"]; }
      else { en = "Maternal aunt"; hi = "मौसी"; spHi = "मौसा"; spEn = "Maternal uncle"; cHi = ["मौसेरा भाई", "मौसेरी बहन"]; }
    } else { en = byG(u, "Uncle", "Aunt", "Uncle/Aunt"); hi = byG(u, "चाचा/मामा", "बुआ/मौसी", "रिश्तेदार"); spEn = "Aunt/Uncle"; spHi = "रिश्तेदार"; cHi = ["चचेरा/ममेरा भाई", "चचेरी/ममेरी बहन"]; }
    if (g(u) !== "male" && g(u) !== "female") { en = side === "male" ? "Paternal uncle/aunt" : side === "female" ? "Maternal uncle/aunt" : "Uncle/Aunt"; }
    push(u, en, hi);
    spousesOf(u).forEach((x) => push(x, spEn, spHi));
    childrenOf(u).sort(byAge).forEach((c) => cousins.push([c, byG(c, cHi[0], cHi[1], cHi[0] + "/" + cHi[1])]));
  }));
  // nephews and nieces: brother's children = bhatija/bhatiji, sister's children = bhanja/bhanji
  sibs.forEach((s) => childrenOf(s).sort(byAge).forEach((c) => {
    const hi = g(s) === "male" ? byG(c, "भतीजा", "भतीजी", "भतीजा/भतीजी") : g(s) === "female" ? byG(c, "भांजा", "भांजी", "भांजा/भांजी") : byG(c, "भतीजा/भांजा", "भतीजी/भांजी", "भतीजा/भांजा");
    push(c, byG(c, "Nephew", "Niece", "Nephew/Niece"), hi);
  }));
  cousins.forEach(([c, hi]) => push(c, "Cousin", hi));
  return out;
}
function plural(label, n) {
  if (n < 2 || lang === "hi") return label;

  if (label === "Child") return "Children";

}

      <div class="field"><label for="l-rel">${esc(t("link_they", { n: nm(id) }))}</label>
        <select id="l-rel" name="rel">
          <option value="parent">${esc(t("l_parent"))}</option><option value="child">${esc(t("l_child"))}</option>
          <option value="spouse">${esc(t("l_spouse"))}</option><option value="sibling">${esc(t("l_sibling"))}</option>
        </select></div>
      <p class="note">${esc(t("link_note"))}</p>
      <div class="form-actions"><button class="btn primary" type="submit">${esc(t("link_btn"))}</button><button class="btn ghost" type="button" data-act="cancel">${esc(t("cancel"))}</button></div>
    </form>`;
}
function focusFirst() { requestAnimationFrame(() => { const i = body.querySelector("input:not([type=checkbox]),select"); if (i && window.innerWidth > 720) i.focus(); }); }

const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
async function addRel(type, a, b) {
  if (a === b) return;
  const id = rid(type, a, b);
  if (relations.has(id)) return;
  await store.setRelation(id, { type, a, b, createdAt: Date.now() });
}

body.addEventListener("click", async (e) => {
  const tg = e.target.closest("[data-act]"); if (!tg) return;
  const act = tg.dataset.act;
  if (act === "close") { panelMode = "view"; closePanel(); }
  else if (act === "cancel") { panelMode = "view"; renderPanel(); }
  else if (act === "edit") { panelMode = "edit"; renderPanel(); }
  else if (act === "add") { panelMode = "add:" + tg.dataset.rel; renderPanel(); }
  else if (act === "link") { panelMode = "link"; renderPanel(); }
  else if (act === "go") { select(tg.dataset.id); }
  else if (act === "editlinks") { editLinks = !editLinks; renderPanel(); }
  else if (act === "photo") { $("#photoInput").value = ""; $("#photoInput").click(); }
  else if (act === "rmphoto") { await run(() => store.deletePhoto(sel), t("t_photo_removed")); }
  else if (act === "unlink") { await run(() => store.deleteRelation(tg.dataset.rid), t("t_link_removed")); }
  else if (act === "copy") {
    const v = tg.dataset.v;
    try { await navigator.clipboard.writeText(v); tg.textContent = t("copied"); setTimeout(() => (tg.textContent = t("copy")), 1400); }
    catch (_) { const span = tg.parentElement.querySelector(".val"); const r = document.createRange(); r.selectNodeContents(span); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t("select_copy")); }
  }
  else if (act === "delete") {
    if (!tg.classList.contains("armed")) { tg.classList.add("armed"); tg.textContent = t("del_confirm"); setTimeout(() => { if (tg.isConnected) { tg.classList.remove("armed"); tg.textContent = t("del"); } }, 4000); return; }
    const id = sel, name = nm(id);
    const rels = [...relations.entries()].filter(([, r]) => r.a === id || r.b === id).map(([k]) => k);
    const ok = await run(async () => { for (const k of rels) await store.deleteRelation(k); if (photos.has(id)) await store.deletePhoto(id); await store.deletePerson(id); }, t("t_removed", { n: name }));
    if (ok) { panelMode = "view"; closePanel(); }
  }
});

const val = (fd, k) => String(fd.get(k) || "").trim();
body.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target; const fd = new FormData(f);
  const err = f.querySelector("#formErr");
  if ((f.id === "personForm" || f.id === "addForm") && !val(fd, "name") && !val(fd, "name_hi")) {
    if (err) { err.textContent = t("name_needed"); err.hidden = false; }
    f.querySelector(lang === "hi" ? "[name=name_hi]" : "[name=name]").focus(); return;
  }
  const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
  try {
    if (f.id === "personForm") {
      const isNew = !f.dataset.id;
      const id = f.dataset.id || newId();
      const doc = isNew ? { createdAt: Date.now() } : { ...people.get(id) };
      BI.forEach((k) => { doc[k] = val(fd, k); doc[k + "_hi"] = val(fd, k + "_hi"); });
      ["gender", "dob", "dod", "phone", "email"].forEach((k) => (doc[k] = val(fd, k)));
      doc.updatedAt = Date.now();
      const label = tx(doc, "name");
      const ok = await run(() => store.savePerson(id, doc), isNew ? t("t_added", { n: label }) : t("t_saved"));
      if (ok) { sel = id; panelMode = "view"; if (isNew && people.size <= 1) fittedOnce = false; changed(); requestAnimationFrame(() => { renderPanel(); if (isNew) centerOn(id); }); }
    } else if (f.id === "addForm") {
      const base = f.dataset.id, rel = f.dataset.rel;
      const nid = newId(), now = Date.now();
      const doc = { name: val(fd, "name"), name_hi: val(fd, "name_hi"), gender: val(fd, "gender") || "other", dob: val(fd, "dob"), gotra: val(fd, "gotra"), gotra_hi: val(fd, "gotra_hi"), createdAt: now, updatedAt: now };
      const opts = [...f.querySelectorAll("input[type=checkbox]:checked")].map((c) => ({ k: c.dataset.k, id: c.dataset.id }));
      const ok = await run(async () => {
        await store.savePerson(nid, doc);
        if (rel === "father" || rel === "mother") {
          await addRel("parent", nid, base);
          for (const o of opts) {
            if (o.k === "marry") await addRel("spouse", nid, o.id);
            if (o.k === "alsoParent") { await addRel("parent", nid, o.id); const sx = rid("sibling", base, o.id); if (relations.has(sx)) await store.deleteRelation(sx); }
          }
        } else if (rel === "spouse") {
          await addRel("spouse", nid, base);
          for (const o of opts) if (o.k === "parentOf") await addRel("parent", nid, o.id);
        } else if (rel === "son" || rel === "daughter") {
          await addRel("parent", base, nid);
          for (const o of opts) if (o.k === "coParent") await addRel("parent", o.id, nid);
        } else {
          const sp = opts.filter((o) => o.k === "sameParent");
          if (sp.length) { for (const o of sp) await addRel("parent", o.id, nid); }
          else await addRel("sibling", base, nid);
        }
      }, t("t_added", { n: tx(doc, "name") }));
      if (ok) {
        panelMode = "view"; changed();
        if (viewMode === "family" && isPhone()) closePanel(); else requestAnimationFrame(() => { renderPanel(); centerOn(nid, true); });
      }
    } else if (f.id === "linkForm") {
      const base = f.dataset.id, who = val(fd, "who"), rel = val(fd, "rel");
      let msg = null;
      if (rel === "parent" && (siblingsOf(base).includes(who) || childrenOf(base).includes(who))) msg = t("e_parent_conflict");
      if (rel === "child" && parentsOf(base).includes(who)) msg = t("e_child_conflict");
      if (msg) toast(msg, true);
      else {
        const ok = await run(async () => {
          if (rel === "parent") await addRel("parent", who, base);
          else if (rel === "child") await addRel("parent", base, who);
          else await addRel(rel, base, who);
        }, t("t_linked"));
        if (ok) { panelMode = "view"; changed(); requestAnimationFrame(renderPanel); }
      }
    }
  } finally { if (btn.isConnected) btn.disabled = false; }
});

$("#photoInput").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0]; if (!file || !sel) return;
  if (!file.type.startsWith("image/")) { toast(t("e_image"), true); return; }
  const id = sel;
  try { const data = await toAvatar(file); await run(() => store.setPhoto(id, data), t("t_photo_saved")); }
  catch (err) { console.warn(err); toast(t("e_image_read"), true); }
});
function toAvatar(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight), out = 320;
      const c = document.createElement("canvas"); c.width = out; c.height = out;
      c.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, out, out);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}

/* ================= toolbar ================= */
const openNew = () => { sel = null; panelMode = "new"; renderTree(); renderPanel(); };
$("#addPersonBtn").onclick = openNew;
$("#tabAdd").onclick = () => { if (focus && people.has(focus) && writable) { select(focus); requestAnimationFrame(() => { const g = body.querySelector(".add-grid"); if (g) g.scrollIntoView({ block: "start", behavior: "smooth" }); }); } else openNew(); };
$("#searchBtn").onclick = () => {
  const bar = $(".bar"), on = !bar.classList.contains("searching");
  bar.classList.toggle("searching", on); $("#searchBtn").setAttribute("aria-expanded", String(on));
  if (on) qIn.focus(); else { qIn.value = ""; results.hidden = true; }
};
$("#ovBtn").onclick = openNew;
const qIn = $("#q"), results = $("#results");
function renderResults() {
  const q = qIn.value.trim().toLowerCase();
  if (!q) { results.hidden = true; return; }
  const hit = (p) => ["name", "name_hi", "location", "location_hi", "gotra", "gotra_hi", "birthplace", "birthplace_hi"].some((k) => String(p[k] || "").toLowerCase().includes(q));
  const hits = [...people.entries()].filter(([, p]) => hit(p)).sort((a, b) => byName(a[0], b[0])).slice(0, 12);
  results.innerHTML = hits.length ? hits.map(([id, p]) => `<button type="button" data-id="${esc(id)}">${esc(nm(id))}<small>${esc([lifeLine(p), tx(p, "location")].filter(Boolean).join(" · "))}</small></button>`).join("") : `<p>${esc(t("no_match", { q: qIn.value.trim() }))}</p>`;
  results.hidden = false;
}
qIn.addEventListener("input", renderResults);
qIn.addEventListener("focus", renderResults);
qIn.addEventListener("keydown", (e) => { if (e.key === "Enter") { const b = results.querySelector("button"); if (b) b.click(); } if (e.key === "Escape") { qIn.value = ""; results.hidden = true; } });
results.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  results.hidden = true; qIn.value = ""; $(".bar").classList.remove("searching"); $("#searchBtn").setAttribute("aria-expanded", "false");
  if (viewMode === "family" && isPhone()) { closePanel(); setFocus(b.dataset.id); } else { select(b.dataset.id); centerOn(b.dataset.id); }
});
document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".search") && !e.target.closest("#searchBtn")) { results.hidden = true; if (!qIn.value) { $(".bar").classList.remove("searching"); $("#searchBtn").setAttribute("aria-expanded", "false"); } } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden && !e.target.closest("input,textarea,select")) { if (panelMode === "view" || panelMode === "new") closePanel(); else { panelMode = "view"; renderPanel(); } } });

let toastT = 0;
function toast(msg, err) { const el2 = $("#toast"); el2.textContent = msg; el2.className = "toast" + (err ? " err" : ""); el2.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el2.hidden = true), err ? 5000 : 2400); }

applyLang();
setView(viewMode, { top: false });
applyView();
boot();
// names are measured to fit their boxes; measure again once the web fonts have arrived
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderTree(); });
})();
</script>
